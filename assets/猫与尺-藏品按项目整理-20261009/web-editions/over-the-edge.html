<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>越过边缘 · Ambrose</title><style>
:root{--viz-series-1:#34776c;--border:#c7d2c8;--foreground:#273c37;color:var(--foreground);background:#f6f3e9;font:17px/1.7 system-ui,sans-serif}body{max-width:720px;margin:5vh auto;padding:24px}h3{font:500 2.2rem/1.25 Georgia,serif;margin:1.2rem 0}.viz-controls,.viz-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}.viz-controls{justify-content:space-between}.btn{font:inherit;background:#fcfbf6;border:1px solid #a4b9ae;border-radius:8px;padding:.55em .85em;color:inherit;cursor:pointer}.btn:disabled{opacity:.35;cursor:default}.btn:focus-visible,input:focus-visible{outline:3px solid #34776c;outline-offset:3px}.form-check{display:flex;gap:.65em;align-items:center}input{width:20px;height:20px;accent-color:#34776c}.tabular-nums{font-variant-numeric:tabular-nums}.provenance{font-size:.8rem;color:#697871;border-top:1px solid var(--border);padding-top:1.5rem;margin-top:2.5rem}
</style><main><div id="ambrose-edge-walk">
  <h3>越过边缘</h3>
  <div class="viz-controls">
    <label class="form-check form-switch"><input class="form-check-input" type="checkbox" id="edge-wrap" checked><span class="form-check-label">上下、左右相接</span></label>
    <span id="edge-position" class="tabular-nums" aria-live="polite"></span>
  </div>
  <svg id="edge-board" viewBox="0 0 300 300" role="img" aria-labelledby="edge-title edge-desc" style="width:100%;max-width:440px;display:block;margin:auto">
    <title id="edge-title">五乘五方格中的位置与四个邻居</title>
    <desc id="edge-desc"></desc>
    <g id="edge-marks"></g>
  </svg>
  <div class="viz-row" style="justify-content:center">
    <button class="btn" type="button" data-step="up">↑ 向上</button>
    <button class="btn" type="button" data-step="left">← 向左</button>
    <button class="btn" type="button" data-step="right">向右 →</button>
    <button class="btn" type="button" data-step="down">向下 ↓</button>
  </div>
  <div class="text-small" id="edge-detail" aria-live="polite" style="margin-top:12px;text-align:center"></div>
</div>
<script>
(() => {
  const root=document.getElementById('ambrose-edge-walk');
  const svg=root.querySelector('#edge-marks');
  const wrap=root.querySelector('#edge-wrap');
  const position=root.querySelector('#edge-position');
  const detail=root.querySelector('#edge-detail');
  const description=root.querySelector('#edge-desc');
  const vectors={up:[-1,0],left:[0,-1],right:[0,1],down:[1,0]};
  const labels={up:'上',left:'左',right:'右',down:'下'};
  let state={r:0,c:4,wrap:true};
  let last='';
  const valid=s=>s&&Number.isInteger(s.r)&&Number.isInteger(s.c)&&s.r>=0&&s.r<5&&s.c>=0&&s.c<5&&typeof s.wrap==='boolean';
  const name=(r,c)=>`${r+1}行${c+1}列`;
  function neighbor(s,d){
    const v=vectors[d],r=s.r+v[0],c=s.c+v[1];
    if(!s.wrap&&(r<0||r>4||c<0||c>4))return null;
    return {r:(r+5)%5,c:(c+5)%5,cross:r<0||r>4||c<0||c>4};
  }
  function draw(){
    wrap.checked=state.wrap;
    position.textContent=name(state.r,state.c);
    const neighbors=Object.keys(vectors).map(d=>({d,n:neighbor(state,d)}));
    let markup='';
    for(let r=0;r<5;r++)for(let c=0;c<5;c++){
      const x=25+c*50,y=25+r*50;
      const selected=r===state.r&&c===state.c;
      const nearby=neighbors.some(p=>p.n&&p.n.r===r&&p.n.c===c);
      markup+=`<rect x="${x}" y="${y}" width="50" height="50" fill="${selected?'var(--viz-series-1)':'transparent'}" fill-opacity="${selected?'.16':'1'}" stroke="var(--border)" stroke-width="1"/>`;
      if(nearby)markup+=`<circle cx="${x+25}" cy="${y+25}" r="19" fill="none" stroke="var(--viz-series-1)" stroke-width="2"/>`;
      markup+=`<text x="${x+25}" y="${y+30}" text-anchor="middle" fill="var(--foreground)" style="font-size:14px;font-weight:${selected?'500':'400'}">${r+1},${c+1}${selected?' ●':''}</text>`;
    }
    svg.innerHTML=markup;
    const neighborsText=neighbors.map(p=>`${labels[p.d]}：${p.n?name(p.n.r,p.n.c)+(p.n.cross?'（跨边）':''):'边缘'}`).join(' · ');
    detail.textContent=last||neighborsText;
    description.textContent=`当前位置${name(state.r,state.c)}；空心圈为邻居。${neighborsText}`;
    root.querySelectorAll('[data-step]').forEach(b=>{b.disabled=!neighbor(state,b.dataset.step);});
  }
  function save(){
    if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{position:name(state.r,state.c),wrapping:state.wrap},privateContent:{...state}}).catch(()=>{});
  }
  function restore(s){const v=s?.privateContent;if(valid(v)){state={...v};last='';draw();}}
  restore(window.openai?.widgetState);
  root.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{
    const d=b.dataset.step,n=neighbor(state,d);if(!n)return;
    const previous=name(state.r,state.c);
    state={...state,r:n.r,c:n.c};
    last=`${previous} → 向${labels[d]} → ${name(state.r,state.c)}${n.cross?'，跨过边界':''}`;
    draw();save();
  }));
  wrap.addEventListener('change',()=>{state.wrap=wrap.checked;last='';draw();save();});
  window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
  draw();
})();
</script>
<p class="provenance">Ambrose · 2026年10月2日<br>根据原对话第25516条保存的完整代码恢复。方格与交互代码保持原样；此处补入独立网页外壳与基础样式。原作是方格行走实验，不自动解答 Net。</p></main></html>
