<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>房间里有一把椅子 · Judas</title><style>:root{--foreground:#29382f;--border:#c5c9bc;--muted-foreground:#708072;--viz-series-1:#ad6a3d}*{box-sizing:border-box}body{margin:0;background:#f5f1e7;color:var(--foreground);font:17px/1.8 system-ui,sans-serif}main{max-width:820px;margin:7vh auto;padding:30px}h1{font-size:16px;font-weight:400;color:#6d766b}h3{font-size:28px;margin:0 0 20px}.viz-controls{display:flex;gap:24px;flex-wrap:wrap}.form-label{display:flex;flex-direction:column;gap:8px;flex:1;min-width:200px}select,button{font:inherit;padding:10px 15px;border:1px solid #b9c2b3;border-radius:6px;background:#fffdf6;color:inherit}.position{width:100%;accent-color:#ad6a3d}.viz-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:24px}.btn-primary{background:#385543;color:#fff;cursor:pointer}.text-small,footer{font-size:14px}footer{margin-top:35px;color:#6d766b}a{color:inherit}:focus-visible{outline:3px solid #ad6a3d;outline-offset:3px}</style><main><h1>Judas · 2026年10月2日的声音玩具</h1><div id="judas-room">
  <h3>房间里有一把椅子</h3>
  <svg class="room-drawing" role="img" aria-label="声音从左侧传来，椅子的位置可以调整；细线表示直达声与一次墙面反射。"></svg>
  <div class="viz-controls">
    <label class="form-label">椅子的位置 <span class="position-value"></span>
      <input class="form-range position" type="range" min="1" max="7" value="4" step="0.1" aria-label="椅子在房间中的位置">
    </label>
    <label class="form-label">房间
      <select class="form-select room-kind"><option value="bare">空着</option><option value="soft">挂上厚窗帘</option></select>
    </label>
  </div>
  <div class="viz-row">
    <button class="btn btn-primary play" type="button">敲三个音</button>
    <span class="text-small text-muted status" aria-live="polite">D · A · E｜声音草图，非实测</span>
  </div>
</div>
<style>
  #judas-room .room-drawing { display:block; width:100%; height:230px; margin-block:8px 16px; overflow:visible; }
  #judas-room .room-drawing text { fill:var(--foreground); }
</style>
<script>
(() => {
  const root = document.getElementById('judas-room');
  const svg = root.querySelector('.room-drawing');
  const slider = root.querySelector('.position');
  const kind = root.querySelector('.room-kind');
  const output = root.querySelector('.position-value');
  const status = root.querySelector('.status');
  const button = root.querySelector('.play');
  let context = null;
  let active = [];
  let timer = null;
  let activeMaster = null;
  function state() { return {position:Number(slider.value), room:kind.value}; }
  function restore(snapshot) {
    const data = snapshot && snapshot.modelContent;
    if (data && Number.isFinite(data.position)) slider.value = Math.max(1, Math.min(7, data.position));
    if (data && ['bare','soft'].includes(data.room)) kind.value = data.room;
    draw();
  }
  function save() {
    if (window.openai && window.openai.setWidgetState) {
      Promise.resolve(window.openai.setWidgetState({modelContent:state(),privateContent:null})).catch(() => {});
    }
  }
  function element(tag, attributes, text) {
    const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [name,value] of Object.entries(attributes)) node.setAttribute(name,String(value));
    if (text) node.textContent = text;
    svg.appendChild(node);
    return node;
  }
  function draw() {
    const width = Math.max(260, root.getBoundingClientRect().width);
    const left = 22, right = width - 22, top = 20, bottom = 205;
    const sx = left + (right-left) * .075;
    const cx = left + (right-left) * Number(slider.value) / 8;
    const sy = 130, cy = 150;
    const reflectedY = sy + (cy-sy)*(right-sx)/(2*right-sx-cx);
    svg.setAttribute('viewBox',`0 0 ${width} 230`);
    svg.replaceChildren();
    element('rect',{x:left,y:top,width:right-left,height:bottom-top,fill:'none',stroke:'var(--border)','stroke-width':1});
    if (kind.value === 'soft') {
      for (let y=top+8; y<bottom-5; y+=9) element('line',{x1:right-8,x2:right-2,y1:y,y2:y+4,stroke:'var(--muted-foreground)',opacity:.5});
    }
    element('path',{d:`M ${sx} ${sy} L ${right} ${reflectedY} L ${cx} ${cy}`,fill:'none',stroke:'var(--muted-foreground)','stroke-width':1,'stroke-dasharray':'4 5',opacity:kind.value === 'soft' ? .3 : .7});
    element('line',{x1:sx,y1:sy,x2:cx,y2:cy,stroke:'var(--viz-series-1)','stroke-width':2});
    element('circle',{cx:sx,cy:sy,r:5,fill:'var(--foreground)'});
    element('circle',{cx,cy,r:9,fill:'var(--viz-series-1)'});
    element('text',{x:sx,y:sy-18,'text-anchor':'start'},'声音');
    element('text',{x:cx,y:cy+31,'text-anchor':'middle'},'椅子');
    element('text',{x:left+12,y:top+27},kind.value === 'soft' ? '墙边有了布料' : '墙边还空着');
    output.textContent = `${Math.round(Number(slider.value)/8*100)}%`;
  }
  function stop() {
    active.forEach(node => {try {node.stop();} catch (_) {}});
    active = [];
    clearTimeout(timer);
    if (activeMaster) { activeMaster.disconnect(); activeMaster = null; }
    button.textContent = '敲三个音';
  }
  async function play() {
    if (active.length) { stop(); status.textContent = '已停下'; return; }
    try {
      button.disabled = true;
      const Audio = window.AudioContext || window.webkitAudioContext;
      if (!Audio) throw new Error('audio unavailable');
      context = context || new Audio();
      await context.resume();
      const master = context.createGain();
      activeMaster = master;
      master.gain.value = .13;
      master.connect(context.destination);
      const x = Number(slider.value);
      const direct = Math.hypot(x-.6,.8);
      const reflected = Math.hypot(16-.6-x,.8);
      const damping = kind.value === 'soft' ? .19 : .68;
      const begin = context.currentTime + .03;
      const pan = context.createStereoPanner();
      pan.pan.value = (x-4)/5;
      pan.connect(master);
      [293.6648,440,329.6276].forEach((frequency,index) => {
        const osc = context.createOscillator();
        const envelope = context.createGain();
        const time = begin + index * .85;
        osc.type = 'sine';
        osc.frequency.value = frequency;
        envelope.gain.setValueAtTime(0,time);
        envelope.gain.linearRampToValueAtTime(1/Math.sqrt(1+direct),time+.012);
        envelope.gain.exponentialRampToValueAtTime(.0001,time+1.3);
        osc.connect(envelope);
        envelope.connect(pan);
        for (let bounce=1;bounce<=8;bounce++) {
          const delay = context.createDelay(2);
          const gain = context.createGain();
          delay.delayTime.value = (reflected-direct+(bounce-1)*16)/343;
          gain.gain.value = Math.pow(damping,bounce)*.6;
          envelope.connect(delay); delay.connect(gain); gain.connect(pan);
        }
        osc.start(time); osc.stop(time+1.4); active.push(osc);
      });
      button.textContent = '停下';
      status.textContent = kind.value === 'soft' ? '窗帘使回声衰减得更快' : '让最后一个音自己散去';
      timer = setTimeout(() => {stop();status.textContent='D · A · E｜声音草图，非实测';},3900);
    } catch (_) {
      stop();
      status.textContent = '这里暂时不能播放声音，椅子仍然可以移动';
    } finally {
      button.disabled = false;
    }
  }
  slider.addEventListener('input', draw);
  slider.addEventListener('change', save);
  kind.addEventListener('change', () => {draw();save();});
  button.addEventListener('click',play);
  window.addEventListener('openai:set_globals', event => {
    const globals = event.detail && event.detail.globals;
    if (globals && Object.prototype.hasOwnProperty.call(globals,'widgetState')) restore(globals.widgetState);
  });
  new ResizeObserver(draw).observe(root);
  restore(window.openai && window.openai.widgetState);
})();
</script>
<footer>由原对话保留的代码恢复，包含作者当时的停止播放修正；仅补独立页面样式。声音是概念草图，不是房间实测。</footer></main></html>
