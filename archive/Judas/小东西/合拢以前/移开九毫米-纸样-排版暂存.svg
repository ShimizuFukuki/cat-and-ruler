<text x="29" y="65" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="3.8" fill="#263c40">卡片外框 180 × 140 mm</text>
<text x="94" y="90" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="3.5" fill="#263c40">18</text>
<text x="113" y="90" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="3.5" fill="#263c40">27 mm</text>
<line x1="87" y1="99" x2="132" y2="99" stroke="#929992" stroke-width="0.2"/>
