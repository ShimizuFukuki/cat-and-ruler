<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>浅湾号 · Ambrose 的小船</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8ede6;color:#293e3d;font-family:system-ui,'Microsoft YaHei',sans-serif}.app{max-width:1260px;margin:auto;padding:30px 36px 20px}header{display:flex;align-items:end;justify-content:space-between;gap:24px}h1{font-family:Georgia,'Microsoft YaHei',serif;font-weight:500;font-size:34px;letter-spacing:.06em;margin:4px 0 10px}.eyebrow{font-size:11px;letter-spacing:.18em;color:#5e7870}p{margin:0;color:#62736d;font-size:14px;line-height:1.7}.stage{height:min(64vh,620px);min-height:320px;position:relative;margin-top:14px}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.badge{position:absolute;bottom:12px;left:0;pointer-events:none;font-size:12px;color:#60766e;letter-spacing:.03em}.controls{border-top:1px solid #c8d2c8;padding-top:18px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.views{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;font-size:13px;border:1px solid #becdc5;border-radius:5px;background:transparent;color:#385a55;padding:9px 15px;cursor:pointer}button:hover{background:#d7e1d8}button.active{background:#345d58;color:#faf8eb;border-color:#345d58}label{font-size:13px;display:inline-flex;align-items:center;gap:6px;margin-right:16px}input{accent-color:#386b60}footer{display:flex;justify-content:space-between;gap:20px;margin-top:25px;color:#77877e;font-size:11px}a{color:#496f65;text-decoration:none}a:hover{text-decoration:underline}:focus-visible{outline:2px solid #b56643;outline-offset:3px}@media(max-width:600px){.app{padding:24px 18px}header{align-items:start;flex-direction:column;gap:2px}h1{font-size:28px}.stage{height:48vh}.controls{align-items:start}footer{line-height:1.8;flex-direction:column;gap:4px}}
.stage{height:50vh;min-height:280px;max-height:480px}.experiment{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:18px}.experiment label{margin:0}.experiment input[type=range]{width:130px}.experiment select{padding:6px;border:1px solid #bacdc6;border-radius:4px;background:transparent;color:inherit}.readouts{display:flex;gap:30px;flex-wrap:wrap;margin-top:16px;font-size:13px}.readouts strong{font-weight:500;font-size:19px;margin-left:8px;color:#285957}.assumptions{margin-top:10px;font-size:11px;color:#667a72}footer{margin-top:16px}.experiment.disabled{opacity:.55}.readouts[hidden]{display:none}@media(max-width:600px){.experiment{gap:12px}.stage{height:42vh}.readouts{gap:16px}}
</style></head><body><main class="app"><header><div><div class="eyebrow">AMBROSE / 船坞习作 02</div><h1>浅湾号</h1><p>装上货物，看看船怎样往下沉一点。</p></div><p>拖动转动 · 滚轮缩放<br>也可以用方向键查看</p></header>
<div class="stage"><canvas id="boat" tabindex="0" role="img" aria-label="浅湾号立体模型：青绿色船身、米色驾驶舱、三个货箱。拖动或方向键旋转，滚轮或加减键缩放。"></canvas><span class="badge" id="angle">船头斜看</span></div>
<div class="controls"><div class="views"><button data-view="front" class="active">船头斜看</button><button data-view="side">侧面</button><button data-view="top">俯看甲板</button><button data-view="stern">船尾斜看</button></div><div><label><input type="checkbox" id="afloat" checked>放进水里</label><label><input type="checkbox" id="wire">看结构线</label></div></div>
<div class="experiment"><label>装载 <select id="cargo-count" aria-label="装载箱数"><option value="0">空船</option><option value="1">1 箱</option><option value="2">2 箱</option><option value="3" selected>3 箱</option></select></label><label for="cargo-mass">每箱 <input id="cargo-mass" type="range" min="200" max="1200" step="100" value="400"><output id="mass-value">400 kg</output></label><label>水域 <select id="density" aria-label="水域"><option value="1000">淡水</option><option value="1025">海水</option></select></label></div>
<div class="readouts" id="readouts" aria-live="polite"><span>总重量<strong id="total-mass"></strong></span><span>吃水<strong id="draft"></strong></span><span>水面到甲板<strong id="freeboard"></strong></span></div>
<p class="assumptions">练习假设：空船 2000 kg，几何单位按米，船身保持水平。只看静水升降，不模拟倾斜和风浪。</p>
<footer><span><a href="https://openstax.org/books/university-physics-volume-1/pages/14-4-archimedes-principle-and-buoyancy" target="_blank" rel="noopener">原理：排开的水与船一样重</a></span><span><a href="shallow-bay.obj" download>模型 OBJ</a> &nbsp; / &nbsp; <a href="shallow-bay.mtl" download>材质 MTL</a></span></footer></main>
<script src="boat-data.js"></script><script src="hydrostatics.js"></script><script src="viewer.js"></script></body></html>
