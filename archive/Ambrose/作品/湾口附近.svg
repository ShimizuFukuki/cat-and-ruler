<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
<title>湾口附近：合作故事中的局部草图</title>
<desc>向东敞开的海湾。Judas原先在北岸，Ambrose在南岸靠泉水处；虚线绕过湾底，又从泉边走向南侧湾口的低石头。北岸有一段未命名的空白。位置是对故事的粗略想象，没有比例尺。</desc>
