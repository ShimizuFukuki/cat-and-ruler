<button type="button" id="pause" aria-pressed="false">停一会儿</button>
<script>
const body=document.getElementById('breath'),tail=document.getElementById('tail'),button=document.getElementById('pause');
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,last=null,elapsed=0;
button.textContent=paused?'接着睡':'停一会儿';button.setAttribute('aria-pressed',String(paused));
function pose(t){const expand=1.6*(1-Math.cos(2*Math.PI*t/4.8));body.setAttribute('ry',68+expand);body.setAttribute('cy',280-expand);
const phase=t%17;let angle=0;if(phase>12&&phase<15){const u=(phase-12)/3;angle=-7*Math.sin(Math.PI*u)**2*Math.sin(2*Math.PI*u);}tail.setAttribute('transform',`rotate(${angle} 520 283)`);}
button.addEventListener('click',()=>{paused=!paused;button.textContent=paused?'接着睡':'停一会儿';button.setAttribute('aria-pressed',String(paused));});
function frame(now){if(last!==null&&!paused&&!document.hidden)elapsed+=Math.min((now-last)/1000,.1);last=now;pose(elapsed);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></html>
