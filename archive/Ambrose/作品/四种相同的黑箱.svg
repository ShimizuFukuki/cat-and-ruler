="369.5" r="8" fill="#485a58"/><circle cx="514.5" cy="311.5" r="8" fill="#b97940"/><text x="500" y="484" text-anchor="middle" font-size="17">第五颗球：第4行，第5列</text><g stroke="#c8cec4" fill="none" stroke-width="1"><path d="M686 210v232M686 210h232"/><path d="M715 210v232M686 239h232"/><path d="M744 210v232M686 268h232"/><path d="M773 210v232M686 297h232"/><path d="M802 210v232M686 326h232"/><path d="M831 210v232M686 355h232"/><path d="M860 210v232M686 384h232"/><path d="M889 210v232M686 413h232"/><path d="M918 210v232M686 442h232"/></g><path d="M787.5 190V253.5H816.5V190" fill="none" stroke="#709ca8" stroke-width="2.5"/><path d="M812.5 196l4-6 4 6" fill="none" stroke="#709ca8" stroke-width="2"/><circle cx="758.5" cy="282.5" r="8" fill="#485a58"/><circle cx="845.5" cy="282.5" r="8" fill="#485a58"/><circle cx="758.5" cy="369.5" r="8" fill="#485a58"/><circle cx="845.5" cy="369.5" r="8" fill="#485a58"/><circle cx="787.5" cy="340.5" r="8" fill="#b97940"/><text x="802" y="484" text-anchor="middle" font-size="17">第五颗球：第5行，第4列</text><g stroke="#c8cec4" fill="none" stroke-width="1"><path d="M988 210v232M988 210h232"/><path d="M1017 210v232M988 239h232"/><path d="M1046 210v232M988 268h232"/><path d="M1075 210v232M988 297h232"/><path d="M1104 210v232M988 326h232"/><path d="M1133 210v232M988 355h232"/><path d="M1162 210v232M988 384h232"/><path d="M1191 210v232M988 413h232"/><path d="M1220 210v232M988 442h232"/></g><path d="M1089.5 190V253.5H1118.5V190" fill="none" stroke="#709ca8" stroke-width="2.5"/><path d="M1114.5 196l4-6 4 6" fill="none" stroke="#709ca8" stroke-width="2"/><circle cx="1060.5" cy="282.5" r="8" fill="#485a58"/><circle cx="1147.5" cy="282.5" r="8" fill="#485a58"/><circle cx="1060.5" cy="369.5" r="8" fill="#485a58"/><circle cx="1147.5" cy="369.5" r="8" fill="#485a58"/><circle cx="1118.5" cy="340.5" r="8" fill="#b97940"/><text x="1104" y="484" text-anchor="middle" font-size="17">第五颗球：第5行，第5列</text><path d="M80 531H1280" stroke="#c7c5b6"/><text x="82" y="573" font-size